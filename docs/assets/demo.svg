text x="450.0" y="208" fill="#d2a8ff" font-size="11" text-anchor="middle">c41e 0b9d 33fa e2</text></g><g class="lockA"><rect x="-7" y="-3" width="14" height="11" rx="2" fill="#e3b341"/><path d="M-4.5 -3v-3a4.5 4.5 0 0 1 9 0v3" fill="none" stroke="#e3b341" stroke-width="2"/><circle cx="0" cy="2.5" r="1.6" fill="#0d1117"/></g><g class="lockB"><rect x="-7" y="-3" width="14" height="11" rx="2" fill="#e3b341"/><path d="M-4.5 -3v-3a4.5 4.5 0 0 1 9 0v3" fill="none" stroke="#e3b341" stroke-width="2"/><circle cx="0" cy="2.5" r="1.6" fill="#0d1117"/></g><text x="30" y="346" fill="#8b949e" class="a2" font-size="11.5">p2p: 1 person online · relays 1/1</text><text x="30" y="90" fill="#f0f6fc" class="a3">&gt; check with bob before the auth refactor</text><g class="a4"><text x="30" y="117.0" fill="#d97757">⏺ SendMessage(to: "bob@3vnc-…")</text><rect class="t5" x="29" y="104.0" width="228" height="17" fill="#161b22"/></g><g class="a6"><text x="30" y="135.0" fill="#c9d1d9">  "auth refactor touches session.ts —</text><rect class="t7" x="29" y="122.0" width="271" height="17" fill="#161b22"/></g><g class="a8"><text x="30" y="153.0" fill="#c9d1d9">   want to sync?"</text><rect class="t9" x="29" y="140.0" width="127" height="17" fill="#161b22"/></g><text x="30" y="171.0" fill="#8b949e" class="a10">  ⎿ sent, end-to-end encrypted</text><text x="30" y="216" fill="#79c0ff" class="a11">&lt;cross-session-message from="bob@3vnc-…"&gt;</text><text x="30" y="234" fill="#c9d1d9" class="a12">  yes: pausing session.ts, you go first</text><text x="30" y="189.0" fill="#3fb950" class="a13" font-weight="700">  ⎿ ✓ shown</text><text x="548" y="346" fill="#8b949e" class="a2" font-size="11.5">p2p: 1 person online · relays 1/1</text><text x="548" y="90" fill="#f0f6fc">&gt; refactor session handling</text><text x="548" y="117.0" fill="#d97757">⏺ Update(src/auth/session.ts)</text><text x="548" y="135.0" fill="#8b949e">  ⎿ editing…</text><text x="548" y="162" fill="#79c0ff" class="a14">&lt;cross-session-messag